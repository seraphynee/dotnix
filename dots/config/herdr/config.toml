onboarding = false

[theme]
  name = "vesper"

[ui]
  confirm_close                     = false
  pane_borders                      = true
  pane_gaps                         = false
  pane_outer_borders                = true
  prompt_new_tab_name               = false
  redraw_on_focus_gained            = true
  show_agent_labels_on_pane_borders = true
  sidebar_collapsed_mode            = "compact"
  tab_bar_position                  = "bottom"

[keys]
  prefix = "ctrl+a"

  # worktree
  new_worktree    = "prefix+W"
  open_worktree   = "prefix+w"
  remove_worktree = "prefix+X"

  # workspaces (tmux sessions)
  close_workspace  = "prefix+g"       # tmux: kill-session
  goto             = "prefix+o"       # moved from g because g = close workspace
  new_workspace    = "prefix+shift+s"
  rename_workspace = "prefix+$"
  # shift+1..9 is parsed as digit+SHIFT, but many terminals send the shifted
  # glyph (!..() without a base digit, so herdr never matches it. Use ctrl.
  switch_workspace = "prefix+ctrl+1..9"
  # workspace_picker = "prefix+w"

  # tabs (tmux windows)
  close_tab    = "prefix+ampersand"
  new_tab      = "prefix+c"
  next_tab     = "prefix+n"
  previous_tab = "prefix+p"
  rename_tab   = "prefix+comma"
  switch_tab   = "prefix+1..9"

  # panes
  close_pane       = "prefix+x"
  focus_pane_down  = "prefix+j"
  focus_pane_left  = "prefix+h"
  focus_pane_right = "prefix+l"
  focus_pane_up    = "prefix+k"
  last_pane        = "prefix+q"
  rename_pane      = "prefix+u"
  swap_pane_down   = "prefix+shift+j"
  swap_pane_left   = "prefix+shift+h"
  swap_pane_right  = "prefix+shift+l"
  swap_pane_up     = "prefix+shift+k"

  # splits
  split_horizontal = "prefix+minus" # tmux: -  (stacked)
  split_vertical   = "prefix+|"     # tmux: |  (side-by-side)

  # reload / resize
  reload_config     = "prefix+r"     # tmux: prefix+r reloads config
  resize_mode       = "prefix+R"     # shifted to R to free up r
  resize_pane_down  = "prefix+down"
  resize_pane_left  = "prefix+left"
  resize_pane_right = "prefix+right"
  resize_pane_up    = "prefix+up"

  # herdr-only features keep nearby keys
  copy_mode      = "prefix+["
  detach         = "prefix+d"
  toggle_sidebar = "prefix+b"
  zoom           = "prefix+z"

  focus_agent = "prefix+alt+1..9"

  # PLUGINS
  # herdr-flash
  [[keys.command]]
    command     = "youguanxinqing.herdr-flash.flash"
    description = "flash: search visible text, then select and yank"
    key         = "prefix+F"
    type        = "plugin_action"

  # herdr-plus
  [[keys.command]]
    command     = "cloudmanic.herdr-plus.projects"
    description = "herdr-plus: projects"
    key         = "prefix+s"
    type        = "plugin_action"

  # herdr-nvim
  [[keys.command]]
    command     = "chmarax.herdr-nvim.pick-file"
    description = "open file from agent output"
    key         = "prefix+O"
    type        = "plugin_action"

  [[keys.command]]
    command     = "herdr-last.toggle-workspace"
    description = "Toggle to last workspace"
    key         = "prefix+A"
    type        = "plugin_action"

  [[keys.command]]
    command     = "herdr-last.toggle-tab"
    description = "Toggle to last tab"
    key         = "prefix+a"
    type        = "plugin_action"
