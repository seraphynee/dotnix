# LLA configuration. Keep this file static so it works on every Home Manager platform.
default_depth     = 3
default_format    = "default"
default_sort      = "name"
enabled_plugins   = []
exclude_paths     = []
include_dirs      = true
permission_format = "symbolic"
plugins_dir       = "~/.config/lla/plugins"
show_icons        = true
theme             = "vesper"

[sort]
  case_sensitive = true
  dirs_first     = true
  natural        = true

[filter]
  case_sensitive    = true
  no_dotfiles       = true
  respect_gitignore = true

[formatters.tree]
  max_lines = 20000

[formatters.grid]
  ignore_width = false
  max_width    = 200

[formatters.long]
  columns        = ["permissions", "size", "modified", "user", "group", "name"]
  date_format    = "%b %d %H:%M"
  hide_group     = true
  relative_dates = true

[formatters.table]
  columns = ["permissions", "size", "modified", "name"]

[listers.recursive]
  max_entries = 20000

[listers.fuzzy]
  editor          = ""
  ignore_patterns = ["node_modules", "target", ".git", ".idea", ".vscode"]
