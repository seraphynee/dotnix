# Terminal multiplexer
# https://github.com/tmux/tmux
# https://man7.org/linux/man-pages/man1/tmux.1.html#top_of_page

# Configuration fragments are deployed by Home Manager under ~/.config/tmux/.
source-file ~/.config/tmux/settings.conf
source-file ~/.config/tmux/keybind.conf
source-file ~/.config/tmux/clipboard.conf
source-file ~/.config/tmux/plugins.conf

# Change this path to switch status bar style.
source-file ~/.config/tmux/status-bar/style-5.conf

# Initialize TMUX plugin manager when it is installed (keep this at the bottom).
run-shell 'if [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'
