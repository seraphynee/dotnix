# === GENERAL SETTINGS ===
# 'set' alias for 'set-option' and 'setw' alias for 'set-window-option'

# Session, window, and pane behavior
# set -g default-shell /opt/homebrew/bin/fish
set -g detach-on-destroy off # Don't exit from tmux when closing a session.
set -g renumber-windows on   # Renumber all windows when any window is closed.
set -g base-index 1          # Set the base index for windows.
set -g pane-base-index 1     # Set the base index for panes.
set -g allow-rename off      # Prevent programs from changing the window name.
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
# set-option -g automatic-rename off # Control automatic window renaming.

# Input and interaction
set -g mode-keys vi # Use Vim-style key bindings in copy-mode.
set -g mouse on     # Enable mouse support.
set -g focus-events on
set -g history-limit 50000 # Keep enough scrollback for editor capture.

# Terminal behavior and compatibility
set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -gq allow-passthrough on

# Preserve modifier keys such as Shift+Enter for applications inside tmux.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'
set -as terminal-overrides ",*:Tc"
# set -ga terminal-overrides ",xterm-256color:Tc"
# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q' # Set cursor style to back set by the terminal app.

# === COLOUR SCHEME ===
_tmux_white=colour15
_tmux_black=colour232
_tmux_red=colour1
_tmux_purple=colour54
_tmux_grey_l=colour145
_tmux_grey_d=colour236
_tmux_blue=colour5
_tmux_blue_d=colour17
_tmux_green=colour2

