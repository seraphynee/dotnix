# Pane appearance

# Active pane style
set -g pane-border-lines double
set -g pane-border-status off                       # Hide pane titles.
set -g pane-border-format ""                       # Keep the title area empty.
set -g pane-border-style "fg=white"                # Normal pane border.
set -g pane-active-border-style "fg=green"         # Active pane border.
set -g display-panes-colour "black"
set -g display-panes-active-colour "white"

# Alternative pane style: minimal borders
# set -g pane-active-border-style "fg=$_tmux_blue"
# set -g message-style "fg=$_tmux_grey_l,bg=$_tmux_grey_d"
# set -g pane-border-style "fg=white"
# set -g display-panes-colour "black"
# set -g display-panes-active-colour "white"
# set -g pane-border-status "off"
