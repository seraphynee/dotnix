# -------------------------------------------------------------------
# Tmux plugins
# -------------------------------------------------------------------
set -g @flash-copy-bind-key "F"

# -------------------------------------------------------------------
# Copy mode (copy-mode-vi)
# -------------------------------------------------------------------
bind-key [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer
